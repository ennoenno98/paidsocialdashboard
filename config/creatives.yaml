# Paid social creatives (Meta ad-level feed via Windsor `facebook`): accounts, naming convention, funnel-stage
# rules, tag synonyms and verdict targets. Yellow-cell equivalents of the old Excel tracker live here.

# Ad accounts to include (Windsor account_id -> brand). Ad names carry the market (IT_ / DE_ prefix).
ad_accounts:
  "1180996603943052": vegavero

# Only these markets (parsed from the ad-name prefix) are paid-social creatives for now; other markets in the
# same ad account (DE boosts) are dropped. Unparseable names are kept (market unknown).
markets: [IT]

# Organic-style objectives in the ad account (page likes, profile visits, post engagement) are not paid
# creatives: rows with these Meta optimisation goals are excluded, like the Instagram post boosts.
exclude_optimization_goals: [VISIT_INSTAGRAM_PROFILE, PAGE_LIKES, POST_ENGAGEMENT, page_visit_view]

# Campaign names that are page / post promotions, not creative assets: excluded from the asset model.
page_promo_patterns:
  - "^\\[\\d{2}/\\d{2}/\\d{4}\\] Promoting "
  - "^Promoting "
  - "^Post: "

# Funnel stage per ad set. Rules run in order on campaign name, ad set name and the targeting JSON;
# the first hit wins. Anything else is `unknown` and listed on the Data quality page.
funnel_stage_rules:
  - { field: campaign, contains: "RTG", stage: retargeting }
  - { field: campaign, contains: "RETARGET", stage: retargeting }
  - { field: adset_name, contains: "website-visitors", stage: retargeting }
  - { field: adset_name, contains: "retarget", stage: retargeting }
  - { field: adset_name, contains: "purchasers", stage: retargeting }
  - { field: targeting, has_custom_audiences: true, stage: retargeting }
  - { field: campaign, contains: "PROSPECTING", stage: prospecting }
  - { field: adset_name, contains: "broad", stage: prospecting }
  - { field: adset_name, contains: "open", stage: prospecting }
  - { field: adset_name, contains: "lookalike", stage: prospecting }
  - { field: targeting, has_custom_audiences: false, stage: prospecting }

# Meta optimisation goal -> short label. The optimisation event is the primary axis inside each funnel-stage view.
optimization_goals:
  OFFSITE_CONVERSIONS: conversion
  VALUE: value
  LINK_CLICKS: link_clicks
  LANDING_PAGE_VIEWS: landing_page_view
  LEAD_GENERATION: leads
  VISIT_INSTAGRAM_PROFILE: profile_visits
  PAGE_LIKES: page_likes
  POST_ENGAGEMENT: engagement
  REACH: reach
  IMPRESSIONS: impressions
  THRUPLAY: thruplay
  AUTOMATIC_OBJECTIVE: auto

# KPI an asset is judged on, by optimisation goal (ROAS / CPA come from Klar when matched, else Meta).
kpi_by_goal:
  conversion: roas
  value: roas
  auto: roas
  landing_page_view: ctr_link
  link_clicks: ctr_link
  leads: ctr_link
  reach: cpm
  impressions: cpm
  thruplay: hook_rate
  engagement: ctr_link
default_kpi: roas

# ROAS / CPA source: klar (attributed orders and gross revenue from Klar marketing_flex, joined on campaign +
# ad name) with Meta 7d-click / 1d-view as fallback for rows Klar has no match for; or meta.
roas_source: klar

# Naming convention: [Prefix_]MARKET_FORMAT_PRODUCT_CONCEPT_STYLE_VERSION_YYYYMM[_SUFFIX]
naming:
  markets: [IT, DE, INT]
  formats:
    PPLImage: static
    Image: static
    Static: static
    Carousel: carousel
    PPLVideo: video
    Video: video
    Reel: video
    DynamicAd: dynamic_catalogue
    DynamicCollection: dynamic_catalogue
    DynamicCarousel: dynamic_catalogue
    Catalog: dynamic_catalogue
  prefixes: ["Test-Human", "Test-Hand", "Test-Product", "Test", "Copy"]
  suffixes: ["LP", "PDP", "AutomaticOptimisation", "Copy 2", "ver2"]

