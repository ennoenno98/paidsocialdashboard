[server]
headless = true

[browser]
gatherUsageStats = false

# Vanatari Corporate Design 2026: plum text, warm-orange highlight, beige page, light-blue elements,
# Satoshi body / Literata headings (webfonts are @imported in app/common.py::page_setup).
[theme]
base = "light"
primaryColor = "#ff5c3e"
backgroundColor = "#fbf7f2"
secondaryBackgroundColor = "#e3eef6"
textColor = "#3c1826"
linkColor = "#2f66be"
borderColor = "#cbbfbf"
font = "Satoshi, sans-serif"
headingFont = "Literata, serif"
baseRadius = "0.4rem"

[theme.sidebar]
backgroundColor = "#e3eef6"
secondaryBackgroundColor = "#fbf7f2"
