name: refresh
on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]       # a merge to main refreshes the data repo right away (and re-registers the cron)
    paths-ignore: ["**.md", "tests/**"]
concurrency:
  group: refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      KLAR_API_KEY: ${{ secrets.KLAR_API_KEY }}
      KLAR_SHOP_ID: ${{ secrets.KLAR_SHOP_ID }}
      KLAR_API_BASE_URL: ${{ vars.KLAR_API_BASE_URL }}
      KLAR_INFLUENCER_REPORT_PATH: ${{ vars.KLAR_INFLUENCER_REPORT_PATH }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_BUSINESS_ACCOUNT_IDS: ${{ secrets.IG_BUSINESS_ACCOUNT_IDS }}
      WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      SOCIAL_XLSX: data/Social_Media.xlsx
      SOCIAL_XLSX_B64: ${{ secrets.SOCIAL_XLSX_B64 }}
      DATA_SNAPSHOT_B64: ${{ secrets.DATA_SNAPSHOT_B64 }}
      KLAR_SHEET_CSV_URLS: ${{ secrets.KLAR_SHEET_CSV_URLS }}
      INPUT_SHEET_CSV_URLS: ${{ secrets.INPUT_SHEET_CSV_URLS }}
      DATA_REPO: ${{ vars.DATA_REPO }}
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e .  # setup-uv already created and activated .venv
      # The workbook and the Klar caches are not committed (PII + internal; the repo is public). They arrive as
      # base64 secrets and are materialised by src.bootstrap (the `secrets` context is not allowed in a step `if`,
      # hence the env indirection).
      - name: Restore workbook and data snapshot from secrets
        if: ${{ env.SOCIAL_XLSX_B64 != '' || env.DATA_SNAPSHOT_B64 != '' }}
        run: python -c "from src.bootstrap import bootstrap; print(bootstrap())"
      - name: Restore previous processed data
        uses: actions/cache@v4
        with:
          path: |
            data/processed
            data/raw
          key: processed-${{ github.run_id }}
          restore-keys: processed-
      - run: python -m src.cli refresh --klar-days 400
      - run: cat data/processed/refresh_status.json
      # Nightly data goes to the PRIVATE data repo (DATA_REPO, default ennoenno98/ennoenno98-paidsocialdashboard-data); the
      # deployed app pulls it at start-up. The push refuses a repo that is not private.
      - name: Push data to the private data repo
        if: ${{ env.DATA_REPO_TOKEN != '' }}
        run: python -m src.cli data-push
      # The repo is public: processed data is kept as a workflow artifact (visible to collaborators only), never
      # as a release asset.
      - name: Keep processed data as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: |
            data/processed/*.parquet
            data/processed/*.csv
            data/processed/refresh_status.json
          retention-days: 14
